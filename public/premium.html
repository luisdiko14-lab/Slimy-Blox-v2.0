<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium - Slimy Blox</title>
    <style>
        body {
            background-color: #000;
            color: #ffd700;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
            overflow: hidden;
        }
        .container {
            border: 2px solid #ffd700;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            background: rgba(0, 0, 0, 0.9);
            position: relative;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            animation: pulse 1s infinite alternate;
        }
        p {
            color: #fff;
            opacity: 0.7;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .features {
            text-align: left;
            margin: 20px 0;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
        }
        .features li {
            color: #fff;
            margin: 10px 0;
            list-style: none;
        }
        .features li::before {
            content: "★ ";
            color: #ffd700;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ffd700;
            background: #ffd700;
            color: #000;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover {
            background: #e6c200;
            box-shadow: 0 0 10px #ffd700;
        }
        .btn-outline {
            background: transparent;
            color: #ffd700;
        }
        .btn-outline:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .price {
            font-size: 36px;
            color: #ffd700;
            margin: 20px 0;
        }
        .price span {
            font-size: 16px;
            opacity: 0.7;
        }
        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.7; transform: scale(0.98); }
        }
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 215, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <h1>PREMIUM ACCESS</h1>
        <p>Unlock exclusive features and dominate the game</p>
        <ul class="features">
            <li>Exclusive premium skins</li>
            <li>Priority server access</li>
            <li>Double XP weekends</li>
            <li>Custom name colors</li>
            <li>No advertisements</li>
            <li>Premium badge</li>
        </ul>
        <div class="price">$4.99 <span>/month</span></div>
        <a href="/buy.html" class="btn">UPGRADE NOW</a>
        <a href="/" class="btn btn-outline">BACK</a>
    </div>
</body>
</html>
