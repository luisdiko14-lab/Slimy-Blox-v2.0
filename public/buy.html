<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Premium - Slimy Blox</title>
    <style>
        body {
            background-color: #000;
            color: #ffd700;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
            overflow: hidden;
        }
        .container {
            border: 2px solid #ffd700;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            background: rgba(0, 0, 0, 0.9);
            position: relative;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            animation: pulse 1s infinite alternate;
        }
        p {
            color: #fff;
            opacity: 0.7;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .plans {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .plan {
            border: 1px solid rgba(255, 215, 0, 0.5);
            padding: 20px;
            flex: 1;
            min-width: 120px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 215, 0, 0.05);
        }
        .plan:hover, .plan.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        .plan-name {
            font-size: 14px;
            margin-bottom: 10px;
            color: #fff;
        }
        .plan-price {
            font-size: 24px;
            color: #ffd700;
        }
        .plan-period {
            font-size: 12px;
            opacity: 0.7;
            color: #fff;
        }
        .plan-save {
            font-size: 11px;
            color: #00ff00;
            margin-top: 5px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ffd700;
            background: #ffd700;
            color: #000;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover {
            background: #e6c200;
            box-shadow: 0 0 10px #ffd700;
        }
        .btn-outline {
            background: transparent;
            color: #ffd700;
        }
        .btn-outline:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .payment-methods {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
        }
        .payment-methods p {
            margin: 0 0 10px 0;
            font-size: 12px;
        }
        .payment-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            color: #fff;
            font-size: 12px;
        }
        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.7; transform: scale(0.98); }
        }
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 215, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }
        .secure {
            font-size: 11px;
            color: #00ff00;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <h1>SELECT YOUR PLAN</h1>
        <p>Choose a subscription that works for you</p>
        <div class="plans">
            <div class="plan" onclick="selectPlan(this)">
                <div class="plan-name">Monthly</div>
                <div class="plan-price">$4.99</div>
                <div class="plan-period">/month</div>
            </div>
            <div class="plan selected" onclick="selectPlan(this)">
                <div class="plan-name">Yearly</div>
                <div class="plan-price">$39.99</div>
                <div class="plan-period">/year</div>
                <div class="plan-save">Save 33%</div>
            </div>
            <div class="plan" onclick="selectPlan(this)">
                <div class="plan-name">Lifetime</div>
                <div class="plan-price">$99.99</div>
                <div class="plan-period">one-time</div>
                <div class="plan-save">Best Value</div>
            </div>
        </div>
        <div class="payment-methods">
            <p>Accepted Payment Methods</p>
            <div class="payment-icons">
                <span>VISA</span>
                <span>MASTERCARD</span>
                <span>PAYPAL</span>
            </div>
        </div>
        <a href="#" class="btn" onclick="processPurchase()">PROCEED TO PAYMENT</a>
        <a href="/premium.html" class="btn btn-outline">BACK</a>
        <div class="secure">Secure payment processing</div>
    </div>
    <script>
        function selectPlan(element) {
            document.querySelectorAll('.plan').forEach(p => p.classList.remove('selected'));
            element.classList.add('selected');
        }
        function processPurchase() {
            alert('Payment processing coming soon!');
        }
    </script>
</body>
</html>
