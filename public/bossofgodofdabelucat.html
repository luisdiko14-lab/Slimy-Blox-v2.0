<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss - Slimy Blox</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }
        .retro-container {
            border: 2px solid #0f0;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            width: 80%;
            max-width: 600px;
        }
        .boss-name {
            font-size: 2rem;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            margin-bottom: 1rem;
        }
        .hp-bar-container {
            width: 100%;
            height: 30px;
            background: #300;
            border: 2px solid #f00;
            margin-bottom: 2rem;
            position: relative;
        }
        #hp-bar {
            width: 100%;
            height: 100%;
            background: #f00;
            transition: width 0.1s;
        }
        .hp-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .npc-container {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            transition: transform 0.05s;
        }
        .npc-container:active {
            transform: scale(0.9);
        }
        .beluga-face {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 50% 50% 40% 40%;
            border: 4px solid #0ff;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        .eye {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #000;
            border-radius: 50%;
            top: 40%;
        }
        .eye.left { left: 25%; }
        .eye.right { right: 25%; }
        .mouth {
            position: absolute;
            width: 60px;
            height: 20px;
            border-bottom: 5px solid #000;
            border-radius: 50%;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        #message {
            margin-top: 1rem;
            font-size: 1.2rem;
            min-height: 1.5rem;
        }
        .win-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="retro-container" id="game-container">
        <div class="boss-name">BELUGA: GOD OF DABELUCAT</div>
        
        <div class="hp-bar-container">
            <div id="hp-bar"></div>
            <div class="hp-text"><span id="hp-val">100</span> / 100</div>
        </div>

        <div class="npc-container" onclick="hit()">
            <div class="beluga-face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
            </div>
        </div>

        <div id="message">CLICK TO ATTACK!</div>
        <div style="margin-top: 1rem; color: #555;">(HINT: 100 CLICKS TO VANQUISH)</div>
    </div>

    <div class="win-screen" id="win-screen">
        <h1 style="color: #ffd700; font-size: 3rem;">BOSS VANQUISHED</h1>
        <p>YOU ARE THE TRUE ADMIN</p>
        <button onclick="window.location.href='/'" style="background: #0f0; color: #000; padding: 1rem 2rem; border: none; font-family: inherit; font-weight: bold; cursor: pointer; margin-top: 2rem;">RETURN TO WORLD</button>
    </div>

    <script>
        let hp = 100;
        const hpBar = document.getElementById('hp-bar');
        const hpVal = document.getElementById('hp-val');
        const message = document.getElementById('message');
        const winScreen = document.getElementById('win-screen');

        function hit() {
            if (hp <= 0) return;
            
            hp -= 1;
            hpBar.style.width = hp + '%';
            hpVal.innerText = Math.max(0, hp);
            
            // Random combat messages
            const msgs = ["CRITICAL HIT!", "DIRECT STRIKE!", "DABELUCAT RECOILS!", "GLITCH ATTACK!"];
            if (hp % 10 === 0) {
                message.innerText = msgs[Math.floor(Math.random() * msgs.length)];
            }

            if (hp <= 0) {
                setTimeout(() => {
                    winScreen.style.display = 'flex';
                }, 500);
            }
        }
    </script>
</body>
</html>
