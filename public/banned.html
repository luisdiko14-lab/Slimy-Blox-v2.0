<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banned - Slimy Blox</title>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
            overflow: hidden;
        }
        .container {
            border: 2px solid #ff0000;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 0 20px #ff0000;
            position: relative;
        }
        .glitch {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 0, 0, 0.1);
            animation: scan 4s linear infinite;
        }
        @keyframes scan {
            from { top: 0; }
            to { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="container">
        <div class="glitch">ACCESS DENIED</div>
        <p>Your unique identifier has been blacklisted.</p>
        <p>Reason: You have been BANNED for only one minute!</p>
        <p style="margin-top: 2rem; font-size: 0.8rem; color: #660000;">[CONNECTION TERMINATED BY SYSTEM ADMIN]</p>
    </div>
</body>
</html>
